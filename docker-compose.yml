services:
  group-ai-bot:
    build: .
    container_name: group-ai-bot
    restart: unless-stopped
    # 改为 bridge + docker_share；AI_BASE_URL 改用容器名访问 axonhub-app
    networks:
      - docker_share
    environment:
      # 原 http://172.17.0.1:8090/v1 是 host 模式下指向宿主 docker0 网关；
      # 现同网改用容器名
      AI_BASE_URL: http://axonhub-app:8090/v1
    env_file:
      - .env
    volumes:
      - bot_data:/data

volumes:
  bot_data:
    external: true
    name: anyincubation_bot_bot_data

networks:
  docker_share:
    external: true
